server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Impor Excel & ekspor laporan bisa besar; batas default nginx 1 MB terlalu
    # kecil untuk itu.
    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset hasil Vite selalu memakai nama ber-hash, jadi aman disimpan lama.
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # fastcgi_params bawaan Debian mengirim `HTTP_HOST $host` yang
        # membuang port (lihat komentar di berkas itu). Akibatnya URL absolut
        # yang dibuat Laravel kehilangan port saat diakses lewat port non-
        # standar. `$http_host` mempertahankan Host persis dari klien; di
        # produksi Traefik sudah membatasi Host sesuai aturan router.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    # Rahasia tidak boleh tersaji: .env, .git, dsb. (.well-known dibiarkan untuk
    # verifikasi domain bila suatu saat dilayani langsung).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
