; Konfigurasi produksi. Kode bersifat immutable (datang dari image), jadi
; beberapa nilai di sini sengaja lebih ketat daripada default PHP.

memory_limit = 512M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M

expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL

date.timezone = Asia/Jakarta
default_charset = UTF-8

; Cookie sesi selalu HttpOnly; SameSite Lax cukup untuk aplikasi murni form.
session.cookie_httponly = 1
session.cookie_samesite = Lax

; OPcache: validasi timestamp dimatikan karena file PHP tidak pernah berubah
; selama container hidup — setiap perubahan kode dihasilkan oleh build image
; baru yang otomatis memakai OPcache bersih.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
