; File ini sengaja diberi awalan `zzz-` supaya dimuat paling akhir dan
; menimpa nilai bawaan image resmi PHP.

[global]
error_log = /proc/self/fd/2

[www]
listen = 127.0.0.1:9000

; php-fpm membersihkan environment secara bawaan, yang membuat variabel dari
; docker-compose tidak terbaca aplikasi. Dimatikan agar APP_KEY, kredensial
; DB, dll. sampai ke kode Laravel.
clear_env = no

; Log worker diteruskan ke stdout agar tampil di panel Dokploy.
catch_workers_output = yes
access.log = /proc/self/fd/2

; ±40 MB per worker. Naikkan/turunkan bersamaan dengan RAM server.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
